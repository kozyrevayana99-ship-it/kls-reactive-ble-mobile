name: reactive_ble_mobile
description: KLS modified Android and iOS implementation for flutter_reactive_ble.
version: 5.4.1
homepage: https://github.com/kozyrevayana99-ship-it/kls-reactive-ble-mobile

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^6.0.0
  reactive_ble_platform_interface: 5.4.1

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter
  mockito: ^5.0.14

flutter:
  plugin:
    platforms:
      android:
        package: com.signify.hue.flutterreactiveble
        pluginClass: ReactiveBlePlugin
      ios:
        pluginClass: ReactiveBlePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: ReactiveBlePlugin
        sharedDarwinSource: true
